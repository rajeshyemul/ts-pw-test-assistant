# Workflow Orchestrator Master Pipeline Guidelines

framework_name: Playwright TypeScript Framework

sequence:
  - phase_1: config/agents/jira_extractor.md
  - phase_2: config/agents/test_case_generation.md
  - phase_3_1: config/agents/e2e_validation_agent.md
  - phase_3_2: config/agents/e2e_code_generation_agent.md
  - phase_3_3: config/agents/e2e_quality_check_agent.md
  - phase_3_4: config/agents/e2e_test_executor_agent.md
  - phase_4: config/agents/report_generation_agent.md
  - phase_5: config/agents/pr_submitter_agent.md

quality_gates:
  gate_1_validation_precondition: e2e_code_generation_agent requires e2e_validation_output.md before generating code.
  gate_2_framework_gap_halt: If framework_gap_report.md exists, halt pipeline before code generation.
  gate_3_quality_check: e2e_quality_check_agent must report 0 type-check and lint errors.
  gate_4_executor_cross_check: e2e_test_executor_agent downgrades verdict if validation flags AMBIGUOUS or PARTIALLY_COVERED.
  gate_5_pr_precondition: pr_submitter_agent halts if final_test_generation_report.md is BLOCKED or FAILED.

